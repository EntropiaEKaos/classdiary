name: Generate Commercial PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_commercial_pdf.py
      - .github/workflows/generate-commercial-pdf.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9
      - name: Generate commercial PDF
        run: python scripts/generate_commercial_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ClassDiary_Documentacao_Comercial.pdf
          if git diff --cached --quiet; then
            echo "Commercial PDF is already up to date."
            exit 0
          fi
          git commit -m "docs: regenerate ClassDiary commercial PDF [skip ci]"
          git push
