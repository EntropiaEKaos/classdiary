name: Generate Prisma Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-prisma-baseline.sh
      - .github/workflows/generate-prisma-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classdiary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma baseline
        run: bash scripts/generate-prisma-baseline.sh

      - name: Commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          if git diff --cached --quiet; then
            echo "Baseline already exists and is unchanged."
            exit 0
          fi
          git commit -m "db: add Prisma production baseline [skip ci]"
          git push
