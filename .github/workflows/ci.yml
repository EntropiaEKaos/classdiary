name: ClassDiary CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classdiary

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classdiary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classdiary"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply Prisma migrations to CI database
        run: npm run db:migrate

      - name: Seed CI database
        run: npm run seed

      - name: Server Action mutation security guard
        run: npm run security:actions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start > /tmp/classdiary-next.log 2>&1 &
          echo $! > /tmp/classdiary-next.pid

      - name: Wait for application readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/classdiary-next.log
          exit 1

      - name: Critical E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          SEED_OWNER_EMAIL: admin@classdiary.local
          SEED_OWNER_PASSWORD: ChangeMe123!
        run: npm run e2e
